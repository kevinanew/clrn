name: 代码仓库检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 依赖与代码检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 配置 uv
        uses: astral-sh/setup-uv@v7
      - name: 安装依赖
        run: npm ci
      - name: 运行代码检查
        run: npm run check
