name: 代码仓库检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 依赖与代码检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: 配置 uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
      - name: 安装依赖
        run: |
          npm ci
          uv venv --python 3.12.12 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
      - name: 运行提交检查
        run: .venv/bin/pre-commit run --all-files
      - name: 验证实际提交拦截与部分暂存
        run: .venv/bin/python scripts/verify-pre-commit.py
      - name: 运行本机单元测试
        run: npm test
