name: H5 E2E

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      CI: 'true'
      E2E_WORKERS: '1'
      E2E_RETRIES: '1'
      E2E_STAGING_URL: ${{ vars.E2E_STAGING_URL }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run E2E tests
        run: npm test
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
