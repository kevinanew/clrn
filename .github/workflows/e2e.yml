name: H5 E2E

on:
  push:
    paths: ['e2e/**', '.github/workflows/e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h5-staging-test-account
  cancel-in-progress: false
  queue: max

jobs:
  e2e:
    # setup-python uses the runner's tool cache; match the Jammy container's glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      CI: 'true'
      E2E_WORKERS: '1'
      E2E_RETRIES: '1'
      E2E_STAGING_URL: ${{ vars.E2E_STAGING_URL }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mitmproxy
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r mitmproxy/requirements.txt
      - name: Check mitmproxy addon
        run: .venv/bin/python -m unittest discover -s mitmproxy -p 'test_*.py'
      - name: Run E2E tests
        run: npm test
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
