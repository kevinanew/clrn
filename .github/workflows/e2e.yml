name: H5 端到端测试

on:
  push:
    paths: ['e2e/**', 'scripts/*ci*', 'scripts/prepare-test-account*', '.github/workflows/e2e.yml']
  workflow_call:
    inputs:
      expected_application_commit:
        description: '本轮 staging 部署的完整应用提交编号'
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account:
    name: 分配测试账号
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.plan.outputs.account }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 规划测试账号
        id: plan
        run: node scripts/plan-ci-accounts.mjs e2e
  e2e:
    name: 运行端到端测试
    needs: account
    concurrency:
      group: h5-staging-account-${{ needs.account.outputs.account }}
      cancel-in-progress: false
      queue: max
    # setup-python 使用 runner 的工具缓存，需与 Jammy 容器的 glibc 匹配。
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      CLRN_EXPECTED_APPLICATION_COMMIT: ${{ inputs.expected_application_commit || '' }}
      CI: 'true'
      E2E_WORKERS: '1'
      E2E_RETRIES: '1'
      E2E_STAGING_URL: ${{ vars.E2E_STAGING_URL }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备本任务独占账号及金币余额
        working-directory: .
        env:
          CLRN_CI_ACCOUNT: ${{ needs.account.outputs.account }}
          CLRN_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_CI_TEST_ACCOUNTS_V2 }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: node scripts/configure-ci-account.mjs
      - name: 安装测试依赖
        run: npm ci
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 mitmproxy
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r mitmproxy/requirements.txt
      - name: 检查 mitmproxy 扩展
        run: .venv/bin/python -m unittest discover -s mitmproxy -p 'test_*.py'
      - name: 等待本次 staging 部署生效
        id: deployment
        if: inputs.expected_application_commit != ''
        working-directory: .
        run: node scripts/staging-deployment.mjs wait
      - name: 运行端到端测试
        run: npm test
      - name: 确认测试期间应用版本未被覆盖
        if: always() && !cancelled() && steps.deployment.outcome == 'success'
        working-directory: .
        run: node scripts/staging-deployment.mjs verify
      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
