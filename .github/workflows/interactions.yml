name: H5 交互与 Freshchat 回归

on:
  push:
    paths:
      - 'e2e/interactions/**'
      - 'e2e/helpers/**'
      - 'e2e/cases/_shared/**'
      - 'e2e/interactions.config.ts'
      - 'e2e/freshchat.config.ts'
      - 'e2e/package*.json'
      - 'scripts/*ci*'
      - 'scripts/prepare-test-account*'
      - '.github/workflows/interactions.yml'
  workflow_call:
    inputs:
      expected_application_commit:
        description: '本轮 staging 部署的完整应用提交编号'
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account:
    name: 分配测试账号
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.plan.outputs.account }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 规划测试账号
        id: plan
        run: node scripts/plan-ci-accounts.mjs interactions
  interactions:
    name: 运行交互与客服回归
    needs: account
    concurrency:
      group: h5-staging-account-${{ needs.account.outputs.account }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      CLRN_EXPECTED_APPLICATION_COMMIT: ${{ inputs.expected_application_commit || '' }}
      CI: 'true'
      E2E_STAGING_URL: ${{ vars.E2E_STAGING_URL }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备本任务独占账号及金币余额
        working-directory: .
        env:
          CLRN_CI_ACCOUNT: ${{ needs.account.outputs.account }}
          CLRN_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_CI_TEST_ACCOUNTS_V2 }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: node scripts/configure-ci-account.mjs
      - name: 安装测试依赖
        run: npm ci
      - name: 等待本次 staging 部署生效
        id: deployment
        if: inputs.expected_application_commit != ''
        working-directory: .
        run: node scripts/staging-deployment.mjs wait
      - name: 运行桌面与触屏交互
        run: npm run test:interactions -- --grep-invert Freshchat
      - name: 运行真实 Freshchat 客服
        run: npm run test:freshchat
      - name: 确认测试期间应用版本未被覆盖
        if: always() && !cancelled() && steps.deployment.outcome == 'success'
        working-directory: .
        run: node scripts/staging-deployment.mjs verify
      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interactions-failure-report
          path: |
            e2e/playwright-report/
            e2e/test-results/interactions/
            e2e/test-results/freshchat/
