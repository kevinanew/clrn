name: H5 Visual Regression

on:
  push:
    branches-ignore: [release]
    paths: ['visual/**', 'e2e/helpers/mitmproxy*.ts', 'e2e/mitmproxy/**', 'scripts/*ci*', '.github/workflows/visual.yml']
  schedule:
    - cron: '12 22 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run all locales and scenarios'
        type: boolean
        default: false
      suite:
        description: 'all 三部分；app 应用；texas 德州；zhajinhua 拼三张'
        type: choice
        options: [all, app, texas, zhajinhua]
        default: all
      mode:
        description: 'compare 对比；reference 生成 Linux 基准供审查下载'
        type: choice
        options: [compare, reference]
        default: compare
      filter:
        description: '可选场景 label 正则（生成新基准时可只选新增场景）'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  accounts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        env:
          CI_VISUAL_SUITE: ${{ inputs.suite || 'all' }}
          CI_VISUAL_FULL: ${{ github.event_name == 'schedule' || inputs.full }}
        run: node scripts/plan-ci-accounts.mjs visual
  visual:
    needs: accounts
    name: ${{ matrix.suite == 'texas' && '德州' || matrix.suite == 'zhajinhua' && '拼三张' || '应用' }} (${{ matrix.locale }})
    # Python 工具缓存需与 Jammy 容器使用相同的 glibc 基线。
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.accounts.outputs.matrix) }}
    # 每个套件和语言独占一个账号；跨工作流选中同一账号时由 GitHub 排队。
    concurrency:
      group: h5-staging-account-${{ matrix.account }}
      cancel-in-progress: false
      queue: max
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VISUAL_SKIP_VISUAL_INSTALL: 'true'
      VISUAL_BASE_URL: https://h5.page.shafayouxi.org/
      VISUAL_LOCALES: ${{ matrix.locale }}
      VISUAL_SCOPE: ${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'core' }}
      VISUAL_SKIP_SUPPORT_TESTS: ${{ matrix.locale != 'zh-Hans' || matrix.suite != 'app' }}
      VISUAL_WORKERS: '1'
      VISUAL_FILTER: ${{ inputs.filter || '' }}
    steps:
      - name: Check out visual tests
        uses: actions/checkout@v4
      - name: 注入本任务独占的 CI 账号
        env:
          CLRN_CI_ACCOUNT: ${{ matrix.account }}
          CLRN_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_CI_TEST_ACCOUNTS }}
        run: node scripts/configure-ci-account.mjs
      - name: Install package managers
        run: |
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
      - name: Install visual dependencies
        working-directory: visual
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mitmproxy
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/python -m pip install -r e2e/mitmproxy/requirements.txt
      - name: Check game proxy isolation and replay
        if: matrix.suite != 'app' && matrix.locale == 'zh-Hans'
        run: e2e/.venv/bin/python -m unittest discover -s visual/cases/${{ matrix.suite == 'texas' && 'texas-holdem' || 'zhajinhua' }}/mitmproxy -v
      - name: Check game record proxy isolation and fixtures
        if: matrix.suite == 'app' && matrix.locale == 'zh-Hans'
        run: e2e/.venv/bin/python -m unittest discover -s visual/cases/game-record/mitmproxy -v
      - name: Check visual suite
        if: matrix.locale == 'zh-Hans' && (matrix.suite == 'app' || inputs.suite == 'texas' || inputs.suite == 'zhajinhua')
        working-directory: visual
        run: |
          pnpm run typecheck
          if [ '${{ inputs.mode }}' != reference ]; then pnpm run test:scenarios; fi
      - name: Run visual suite
        working-directory: visual
        env:
          VISUAL_SUITE: ${{ matrix.suite }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: |
          if [ '${{ inputs.mode }}' = reference ]; then
            pnpm exec tsx run-visual.ts reference
          else
            pnpm run test:ci
          fi
      - name: Upload reference screenshots for review
        if: always() && !cancelled() && inputs.mode == 'reference'
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.suite }}-${{ matrix.locale }}-reference
          path: visual/cases/*/snapshots/*.png
          if-no-files-found: error
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.suite }}-${{ matrix.locale }}-failure-report
          path: |
            visual/playwright-report/
            visual/test-results/
          if-no-files-found: ignore
