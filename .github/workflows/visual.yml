name: H5 Visual Regression

on:
  push:
    branches-ignore: [release]
    paths: ['visual/**', 'e2e/helpers/mitmproxy*.ts', 'e2e/mitmproxy/**', '.github/workflows/visual.yml']
  schedule:
    - cron: '12 22 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run all locales and scenarios'
        type: boolean
        default: false
      suite:
        description: 'all 两部分；app 应用；texas 德州'
        type: choice
        options: [all, app, texas]
        default: all
      mode:
        description: 'compare 对比；reference 生成 Linux 基准供审查下载'
        type: choice
        options: [compare, reference]
        default: compare
      filter:
        description: '可选场景 label 正则（生成新基准时可只选新增场景）'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  visual:
    name: ${{ matrix.suite == 'texas' && '德州' || '应用' }} (${{ matrix.locale }})
    # Python 工具缓存需与 Jammy 容器使用相同的 glibc 基线。
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'app' && '["app"]' || inputs.suite == 'texas' && '["texas"]' || '["app","texas"]') }}
        locale: ${{ fromJSON((github.event_name == 'schedule' || inputs.full) && '["zh-Hans","zh-Hant","en"]' || '["zh-Hans"]') }}
    # 同套测试的语言/轮次互斥；德州用独立账号，与应用及功能/E2E 可并行。
    # 显式改回应用账号时恢复跨工作流互斥。
    concurrency:
      group: ${{ matrix.suite == 'texas' && vars.VISUAL_TEXAS_USERNAME != 'laiwanvisual01' && 'h5-staging-texas-test-account' || 'h5-staging-test-account' }}
      cancel-in-progress: false
      queue: max
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VISUAL_SKIP_VISUAL_INSTALL: 'true'
      VISUAL_BASE_URL: https://h5.page.shafayouxi.org/
      VISUAL_LOCALES: ${{ matrix.locale }}
      VISUAL_SCOPE: ${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'core' }}
      VISUAL_SKIP_SUPPORT_TESTS: ${{ matrix.locale != 'zh-Hans' || matrix.suite != 'app' }}
      VISUAL_WORKERS: '1'
      VISUAL_FILTER: ${{ inputs.filter || '' }}
    steps:
      - name: Check out visual tests
        uses: actions/checkout@v4
      - name: Install package managers
        run: |
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
      - name: Install visual dependencies
        working-directory: visual
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        if: matrix.suite == 'texas'
        with:
          python-version: '3.12'
      - name: Install mitmproxy for Texas
        if: matrix.suite == 'texas'
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/python -m pip install -r e2e/mitmproxy/requirements.txt
      - name: Check Texas proxy isolation and replay
        if: matrix.suite == 'texas' && matrix.locale == 'zh-Hans'
        run: e2e/.venv/bin/python -m unittest discover -s visual/cases/texas-holdem/mitmproxy -v
      - name: Check visual suite
        if: matrix.locale == 'zh-Hans' && (matrix.suite == 'app' || inputs.suite == 'texas')
        working-directory: visual
        run: |
          pnpm run typecheck
          if [ '${{ inputs.mode }}' != reference ]; then pnpm run test:scenarios; fi
      - name: Run visual suite
        working-directory: visual
        env:
          VISUAL_SUITE: ${{ matrix.suite }}
          VISUAL_USERNAME: ${{ matrix.suite == 'texas' && vars.VISUAL_TEXAS_USERNAME || '' }}
          VISUAL_PASSWORD: ${{ matrix.suite == 'texas' && secrets.VISUAL_TEXAS_PASSWORD || '' }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: |
          if [ -n "$VISUAL_USERNAME" ] && [ "$VISUAL_USERNAME" != laiwanvisualtexas01 ] && [ -z "$VISUAL_PASSWORD" ]; then
            echo '::error::自定义德州账号必须配置 VISUAL_TEXAS_PASSWORD Secret。'
            exit 1
          fi
          if [ "$VISUAL_USERNAME" != "$(printf '%s' "$VISUAL_USERNAME" | tr -d '[:space:]')" ]; then
            echo '::error::VISUAL_TEXAS_USERNAME 不得包含空白字符。'
            exit 1
          fi
          if [ '${{ inputs.mode }}' = reference ]; then
            pnpm exec tsx run-visual.ts reference
          else
            pnpm run test:ci
          fi
      - name: Upload reference screenshots for review
        if: success() && inputs.mode == 'reference'
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.suite }}-${{ matrix.locale }}-reference
          path: visual/cases/*/snapshots/*.png
          if-no-files-found: error
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.suite }}-${{ matrix.locale }}-failure-report
          path: |
            visual/playwright-report/
            visual/test-results/
          if-no-files-found: ignore
