# 每个浏览器任务使用固定 Release 包启动独立服务器，账号锁继续隔离共享后端。
name: H5 画面回归测试

# 使用 100 个 Web 专用账号的新凭据，保留账号并发锁并兼容旧分支继续运行。
on:
  # PR 回归统一由 staging-deployment.yml 调用，固定本分支部署记录。
  push:
    branches: [master]
    # 单独的部署记录由 staging-deployment.yml 调用本工作流，避免重复运行全量画面。
    paths-ignore: ['deployments/staging.json']
  workflow_call:
    inputs:
      release_record:
        description: 本轮固定的 Release 发布记录
        required: false
        type: string
      expected_application_commit:
        description: '本轮 Release 的完整应用提交编号'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      suite:
        description: 'all：全部；app：应用；texas：德州；zhajinhua：拼三张'
        type: choice
        options: [all, app, texas, zhajinhua]
        default: all
      mode:
        description: 'compare：对比；reference：生成 Linux 基准供审查下载'
        type: choice
        options: [compare, reference]
        default: compare
      filter:
        description: '可选场景标签正则（生成新基准时可只选新增场景）'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  accounts:
    name: 分配画面测试账号
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 规划画面测试账号
        id: plan
        env:
          CI_VISUAL_SUITE: ${{ inputs.suite || 'all' }}
          CI_VISUAL_FULL: 'true'
        run: node scripts/plan-ci-accounts.mjs visual
  visual:
    needs: accounts
    name: ${{ matrix.suite == 'texas' && '德州' || matrix.suite == 'zhajinhua' && '拼三张' || '应用' }}画面（${{ matrix.locale == 'zh-Hans' && '简体中文' || matrix.locale == 'zh-Hant' && '繁体中文' || '英语' }}）
    # Python 工具缓存需与 Jammy 容器使用相同的 glibc 基线。
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.accounts.outputs.matrix) }}
    # 每个套件和语言独占一个账号；跨工作流选中同一账号时由 GitHub 排队。
    concurrency:
      group: h5-staging-account-${{ matrix.account }}
      cancel-in-progress: false
      queue: max
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      CLRN_EXPECTED_APPLICATION_COMMIT: ${{ inputs.expected_application_commit || '' }}
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VISUAL_SKIP_VISUAL_INSTALL: 'true'
      VISUAL_LOCALES: ${{ matrix.locale }}
      VISUAL_SCOPE: full
      VISUAL_SKIP_SUPPORT_TESTS: ${{ matrix.locale != 'zh-Hans' || matrix.suite != 'app' }}
      VISUAL_WORKERS: '1'
      VISUAL_FILTER: ${{ inputs.filter || '' }}
    steps:
      - name: 检出画面测试代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 准备本任务独占账号及金币余额
        env:
          CLRN_CI_ACCOUNT: ${{ matrix.account }}
          CLRN_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_CI_TEST_ACCOUNTS_V3 }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: node scripts/configure-ci-account.mjs
      - name: 安装包管理器
        run: |
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
      - name: 安装画面测试依赖
        working-directory: visual
        run: pnpm install --frozen-lockfile
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 mitmproxy
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/python -m pip install -r e2e/mitmproxy/requirements.txt
      - name: 检查牌局代理隔离与回放
        if: matrix.suite != 'app' && matrix.locale == 'zh-Hans'
        run: e2e/.venv/bin/python -m unittest discover -s visual/cases/${{ matrix.suite == 'texas' && 'texas-holdem' || 'zhajinhua' }}/mitmproxy -v
      - name: 检查牌局记录代理隔离与测试数据
        if: matrix.suite == 'app' && matrix.locale == 'zh-Hans'
        run: e2e/.venv/bin/python -m unittest discover -s visual/cases/game-record/mitmproxy -v
      - name: 检查画面测试套件
        if: matrix.locale == 'zh-Hans' && (matrix.suite == 'app' || inputs.suite == 'texas' || inputs.suite == 'zhajinhua')
        working-directory: visual
        run: |
          pnpm run typecheck
          if [ '${{ inputs.mode }}' != reference ]; then pnpm run test:scenarios; fi
      - name: 准备本轮 Release 构建包
        uses: ./.github/actions/prepare-release-web
        with:
          release-record: ${{ inputs.release_record || '' }}
          expected-application-commit: ${{ inputs.expected_application_commit || '' }}
          github-token: ${{ github.token }}
      - name: 运行画面测试套件
        working-directory: visual
        env:
          VISUAL_SUITE: ${{ matrix.suite }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: |
          if [ '${{ inputs.mode }}' = reference ]; then
            node ../scripts/with-release-web-server.mjs pnpm exec tsx run-visual.ts reference
          else
            node ../scripts/with-release-web-server.mjs pnpm run test:ci
          fi
      - name: 展示连接诊断摘要
        if: always()
        run: node scripts/connection-diagnostic-summary.mjs
      - name: 上传基准截图供审查
        if: always() && !cancelled() && inputs.mode == 'reference'
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.suite }}-${{ matrix.locale }}-reference
          path: visual/cases/*/snapshots/*.png
          if-no-files-found: error
      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.suite }}-${{ matrix.locale }}-failure-report
          path: |
            visual/playwright-report/
            visual/test-results/
          if-no-files-found: ignore
