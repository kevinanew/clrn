# 每个浏览器任务使用固定 Release 包启动独立服务器，账号锁继续隔离共享后端。
name: H5 画面回归测试

# 使用 100 个 Web 专用账号的新凭据，保留账号并发锁并兼容旧分支继续运行。
on:
  pull_request:
    paths: ['scripts/*release*', 'scripts/extract-web-package.py', '.github/actions/prepare-release-web/**', 'visual/**', 'e2e/helpers/staging-notice.ts', 'e2e/helpers/*proxy*.ts', 'e2e/helpers/*diagnostic*', 'scripts/connection-diagnostic-summary.mjs', 'e2e/mitmproxy/**', 'scripts/*ci*', 'scripts/prepare-test-account*', '.github/workflows/visual.yml', '.github/workflows/ci-visual-shards.yml']
  push:
    branches: [master]
    # 单独的部署记录由 staging-deployment.yml 调用本工作流，避免重复运行全量画面。
    paths-ignore: ['deployments/staging.json']
  workflow_call:
    inputs:
      release_record:
        description: 本轮固定的 Release 发布记录
        required: false
        type: string
      expected_application_commit:
        description: '本轮 Release 的完整应用提交编号'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      full_run:
        description: 忽略失败历史并执行当前选择的完整测试计划
        type: boolean
        default: false
      suite:
        description: 'all：全部；app：应用；texas：德州；zhajinhua：拼三张'
        type: choice
        options: [all, app, texas, zhajinhua]
        default: all
      mode:
        description: 'compare：对比；reference：生成 Linux 基准供审查下载'
        type: choice
        options: [compare, reference]
        default: compare
      filter:
        description: '可选场景标签正则（生成新基准时可只选新增场景）'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  accounts:
    name: 分配画面测试账号
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      priority: ${{ steps.plan.outputs.priority }}
      remaining: ${{ steps.plan.outputs.remaining }}
      priority_count: ${{ steps.plan.outputs.priority_count }}
      remaining_count: ${{ steps.plan.outputs.remaining_count }}
      release_record: ${{ steps.plan.outputs.release_record }}
      application_commit: ${{ steps.plan.outputs.application_commit }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 固定构建并规划本轮全部分片
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_SCHEDULE_OPTIONS: ${{ toJSON(inputs) }}
        run: node scripts/ci-schedule.mjs plan visual
      - name: 保存完整计划供连续修复轮次读取
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan-visual-${{ github.run_attempt }}
          path: ci-plan.json
          retention-days: 30
          if-no-files-found: error
  priority:
    name: 优先验证历史失败
    needs: accounts
    if: needs.accounts.outputs.priority_count != '0'
    uses: ./.github/workflows/ci-visual-shards.yml
    with:
      matrix: ${{ needs.accounts.outputs.priority }}
      release_record: ${{ needs.accounts.outputs.release_record }}
      expected_application_commit: ${{ needs.accounts.outputs.application_commit }}
      suite: ${{ inputs.suite || 'all' }}
      mode: ${{ inputs.mode || 'compare' }}
      filter: ${{ inputs.filter || '' }}
    secrets: inherit
  remaining:
    name: 执行剩余完整回归
    needs: [accounts, priority]
    if: >-
      always() && !cancelled() && needs.accounts.result == 'success' &&
      needs.accounts.outputs.remaining_count != '0' &&
      (needs.priority.result == 'success' ||
       (needs.accounts.outputs.priority_count == '0' && needs.priority.result == 'skipped'))
    uses: ./.github/workflows/ci-visual-shards.yml
    with:
      matrix: ${{ needs.accounts.outputs.remaining }}
      release_record: ${{ needs.accounts.outputs.release_record }}
      expected_application_commit: ${{ needs.accounts.outputs.application_commit }}
      suite: ${{ inputs.suite || 'all' }}
      mode: ${{ inputs.mode || 'compare' }}
      filter: ${{ inputs.filter || '' }}
    secrets: inherit
  visual:
    name: ${{ matrix.suite == 'texas' && '德州' || matrix.suite == 'zhajinhua' && '拼三张' || '应用' }}画面（${{ matrix.locale == 'zh-Hans' && '简体中文' || matrix.locale == 'zh-Hant' && '繁体中文' || '英语' }}）
    needs: [accounts, priority, remaining]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 规划失败时仍创建失败门禁，不能让空矩阵或 skipped 放行。
      matrix: ${{ fromJSON(needs.accounts.outputs.matrix || '{"include":[{"suite":"app","locale":"zh-Hans","part":"application"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 核对当前提交全量结果并生成摘要
        env:
          CI_SCHEDULE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-schedule.mjs gate visual
