name: H5 Visual Regression

on:
  push:
    branches-ignore: [release]
    paths: ['visual/**', '.github/workflows/visual.yml']
  schedule:
    - cron: '12 22 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run all locales and scenarios'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: h5-staging-test-account
  cancel-in-progress: false
  queue: max

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        locale: ${{ fromJSON((github.event_name == 'schedule' || inputs.full) && '["zh-Hans","zh-Hant","en"]' || '["zh-Hans"]') }}
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VISUAL_SKIP_VISUAL_INSTALL: 'true'
      VISUAL_BASE_URL: https://h5.page.shafayouxi.org/
      VISUAL_LOCALES: ${{ matrix.locale }}
      VISUAL_SCOPE: ${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'core' }}
      VISUAL_WORKERS: '1'
    steps:
      - name: Check out visual tests
        uses: actions/checkout@v4
      - name: Install package managers
        run: |
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
      - name: Install visual dependencies
        working-directory: visual
        run: pnpm install --frozen-lockfile
      - name: Check visual suite
        working-directory: visual
        run: |
          pnpm run typecheck
          pnpm run test:scenarios
      - name: Compare screenshots
        working-directory: visual
        run: pnpm run test:ci
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.locale }}-failure-report
          path: |
            visual/playwright-report/
            visual/test-results/
          if-no-files-found: ignore
