# 两阶段共用原有测试实现，只有调度矩阵由调用方决定。
name: H5 animations 分片执行
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      release_record:
        required: true
        type: string
      expected_application_commit:
        required: true
        type: string
      suite:
        type: string
        default: all
      update_snapshots:
        type: boolean
        default: false
      card_sprite_control:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  animations:
    name: 动画关键帧 (${{ matrix.suite }}/${{ matrix.part }}) [ci:animations/${{ matrix.suite }}/${{ matrix.part }}]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    concurrency:
      group: h5-staging-account-${{ matrix.account }}
      cancel-in-progress: false
      queue: max
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      CI: 'true'
      VISUAL_SUITE: ${{ matrix.suite }}
      ANIMATION_PART: ${{ matrix.part }}
      CLRN_EXPECTED_APPLICATION_COMMIT: ${{ inputs.expected_application_commit || '' }}
      TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 注入本任务独占的测试账号
        env:
          CLRN_CI_ACCOUNT: ${{ matrix.account }}
          CLRN_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_CI_TEST_ACCOUNTS_V3 }}
        run: node scripts/configure-ci-account.mjs
      - name: 安装锁定的测试依赖
        run: |
          npm ci
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          cd visual
          pnpm install --frozen-lockfile
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装网络场景代理
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/python -m pip install -r e2e/mitmproxy/requirements.txt
      - name: 检查应用场景与消息夹具
        if: matrix.suite == 'app' && matrix.part == 'application'
        run: e2e/.venv/bin/python -m unittest discover -s e2e/mitmproxy -v
      - name: 检查 TypeScript
        run: npm run typecheck
      - name: 检查德州房间规则读取边界
        if: matrix.suite == 'texas' && matrix.part == 'social'
        run: e2e/.venv/bin/python -m unittest discover -s visual/cases/texas-holdem/mitmproxy -v
      - name: 验证底部弹层的文档和应用壳滚动锁定
        if: matrix.suite == 'app' && matrix.part == 'application'
        run: node --import tsx --test visual/animations/bottomSheetScroll.browser.ts visual/animations/renderReadiness.browser.ts
      - name: 验证老虎机横幅起点与余额遮罩
        if: matrix.suite == 'app' && matrix.part == 'ui'
        run: node --import tsx --test visual/animations/slotBannerPreparation.browser.ts visual/animations/walletMask.browser.ts
      - name: 验证关键帧差异汇总、牌面就绪、素材定位与续时准备
        if: matrix.suite == 'texas' && matrix.part == 'gameplay'
        run: node --import tsx --test visual/animations/timeline.browser.ts visual/animations/cardSpriteReadiness.browser.ts visual/animations/cardSpriteDiagnostics.browser.ts visual/animations/cardSpriteClock.browser.ts visual/animations/cardSpriteLoader.browser.ts visual/animations/cardSpriteHistory.browser.ts visual/animations/playerAnimationAsset.browser.ts visual/animations/renewReadiness.browser.ts visual/animations/leaderboardReadiness.browser.ts visual/animations/playerProfileReadiness.browser.ts visual/animations/tableConnection.browser.ts
      - name: 准备本轮 Release 构建包
        id: release
        uses: ./.github/actions/prepare-release-web
        with:
          release-record: ${{ inputs.release_record || '' }}
          expected-application-commit: ${{ inputs.expected_application_commit || '' }}
          github-token: ${{ github.token }}
      - name: 生成本轮候选基准
        if: inputs.update_snapshots == true
        working-directory: visual
        run: node ../scripts/with-release-web-server.mjs pnpm run test:animations:ci --update-snapshots
      - name: 打包本套件改动的候选图
        if: always() && !cancelled() && inputs.update_snapshots == true
        shell: bash
        run: |
          mkdir -p visual/test-results/animation-candidates
          git -c safe.directory="$GITHUB_WORKSPACE" ls-files -z --modified --others --exclude-standard -- visual/animations/snapshots \
            > visual/test-results/animation-candidates/files.list
          tar --null -T visual/test-results/animation-candidates/files.list \
            -czf visual/test-results/animation-candidates/${{ matrix.suite }}-${{ matrix.part }}.tar.gz
      - name: 提前保存候选图供检查
        if: always() && !cancelled() && inputs.update_snapshots == true
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ matrix.suite }}-${{ matrix.part }}-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: visual/test-results/animation-candidates/${{ matrix.suite }}-${{ matrix.part }}.tar.gz
      - name: 连续三次比较手机和桌面动画关键帧
        working-directory: visual
        run: node ../scripts/with-release-web-server.mjs pnpm run test:animations:ci --repeat-each=3
      - name: 独立新牌局图集时钟对照（不替代动画比较）
        if: ${{ !cancelled() && steps.release.outcome == 'success' && inputs.card_sprite_control == true && matrix.suite == 'texas' && matrix.part == 'gameplay' }}
        working-directory: visual
        env:
          ANIMATION_PART: card-sprite-control
        run: node ../scripts/with-release-web-server.mjs pnpm run test:animations:ci --repeat-each=3
      - name: 展示连接诊断摘要
        if: always()
        run: node scripts/connection-diagnostic-summary.mjs
      - name: 准备首张失败截图供网页预览
        if: always()
        id: preview
        shell: bash
        run: |
          if [ -d visual/test-results/animations ]; then
            screenshot=$(find visual/test-results/animations -type f \( -name 'failure.png' -o -name 'test-failed-*.png' \) -print -quit)
          fi
          if [ -n "${screenshot:-}" ]; then
            cp -- "$screenshot" visual/test-results/animations/failure-preview.png
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: 保存关键帧对比和时间采样报告
        if: always()
        id: report
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ matrix.suite }}-${{ matrix.part }}-report-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            visual/playwright-report/animations/
            visual/test-results/animations/
            visual/playwright-report/card-sprite-control/
            visual/test-results/card-sprite-control/
            visual/test-results/animation-candidates/
      - name: 单独保存失败截图
        if: always()
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ matrix.suite }}-${{ matrix.part }}-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            visual/test-results/animations/**/failure.png
            visual/test-results/animations/**/test-failed-*.png
      - name: 上传可直接预览的失败截图
        if: always() && steps.preview.outputs.available == 'true'
        id: preview_image
        uses: actions/upload-artifact@v7
        with:
          path: visual/test-results/animations/failure-preview.png
          archive: false
          retention-days: 14
      - name: 在运行摘要中给出截图入口
        if: always()
        env:
          PREVIEW_URL: ${{ steps.preview_image.outputs.artifact-url }}
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          echo '### 动画测试产物' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PREVIEW_URL" ]; then
            echo "[直接预览首张失败截图]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$SCREENSHOTS_URL" ]; then
            echo "[下载失败截图 PNG]($SCREENSHOTS_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$REPORT_URL" ]; then
            echo "[下载完整 Playwright 报告]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
