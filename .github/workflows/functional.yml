# 每个浏览器任务使用固定 Release 包启动独立服务器，账号锁继续隔离共享后端。
name: H5 线上功能案例

# 使用 100 个 Web 专用账号的新凭据，保留账号并发锁并兼容旧分支继续运行。
on:
  push:
    branches: [master]
    paths: ['scripts/*release*', 'scripts/extract-web-package.py', '.github/actions/prepare-release-web/**', 'e2e/**', 'scripts/*ci*', 'scripts/prepare-test-account*', '.github/workflows/functional.yml']
  workflow_call:
    inputs:
      release_record:
        description: 本轮固定的 Release 发布记录
        required: false
        type: string
      expected_application_commit:
        description: '本轮 Release 的完整应用提交编号'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      scope:
        description: 'existing：不创建；registration：仅注册；all：包含俱乐部和牌局创建'
        type: choice
        options: [existing, registration, all]
        default: existing

permissions:
  contents: read

jobs:
  account:
    name: 分配测试账号
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.plan.outputs.account }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 规划测试账号
        id: plan
        run: node scripts/plan-ci-accounts.mjs functional
  functional:
    name: 运行线上功能测试
    needs: account
    concurrency:
      group: h5-staging-account-${{ needs.account.outputs.account }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      CLRN_EXPECTED_APPLICATION_COMMIT: ${{ inputs.expected_application_commit || '' }}
      E2E_STAGING_URL: ${{ vars.E2E_STAGING_URL }}
      TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 准备本任务独占账号及金币余额
        env:
          CLRN_CI_ACCOUNT: ${{ needs.account.outputs.account }}
          CLRN_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_CI_TEST_ACCOUNTS_V3 }}
          TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
        run: node scripts/configure-ci-account.mjs
      - name: 检查测试注册及创建场景配置
        if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'registration')
        shell: sh
        run: |
          missing=0
          names="TESTING_API_TOKEN"
          if [ "${{ inputs.scope }}" = all ]; then
            names="$names E2E_CREATION_USERNAME E2E_CREATION_PASSWORD"
          fi
          for name in $names; do
            if ! printenv "$name" | grep -q .; then
              echo "::error::缺少 $name；请检查 CI 账号池及 TESTING_API_TOKEN Secret。"
              missing=1
            fi
          done
          exit "$missing"
      - name: 安装测试依赖
        working-directory: e2e
        run: npm ci
      - name: 检查测试账号及余额接口辅助代码
        working-directory: e2e
        run: npx playwright test test-user.spec.ts test-wallet.spec.ts --workers=1
      - name: 准备本轮 Release 构建包
        uses: ./.github/actions/prepare-release-web
        with:
          release-record: ${{ inputs.release_record || '' }}
          expected-application-commit: ${{ inputs.expected_application_commit || '' }}
          github-token: ${{ github.token }}
      - name: 运行线上 TypeScript 案例
        working-directory: e2e
        env:
          FUNCTIONAL_SCOPE: ${{ inputs.scope || 'existing' }}
        run: |
          if [ "$FUNCTIONAL_SCOPE" = all ]; then
            node ../scripts/with-release-web-server.mjs npm run test:functional
          elif [ "$FUNCTIONAL_SCOPE" = registration ]; then
            node ../scripts/with-release-web-server.mjs npm run test:functional:registration
          else
            # 已有账号只读案例允许网络瞬态故障重试一次，失败的断言仍会再次执行。
            # 注册／创建场景维持零重试，避免重复创建数据。
            node ../scripts/with-release-web-server.mjs npm run test:functional:existing -- --retries=1
          fi
      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-failure-report
          path: |
            e2e/playwright-report/cases/
            e2e/test-results/cases/
