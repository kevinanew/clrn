name: H5 线上功能案例

on:
  push:
    paths: ['e2e/**', 'scripts/*ci*', '.github/workflows/functional.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: 'existing 不创建；registration 仅注册；all 包含俱乐部和牌局创建'
        type: choice
        options: [existing, registration, all]
        default: existing

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.plan.outputs.account }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        run: node scripts/plan-ci-accounts.mjs functional
  functional:
    needs: account
    concurrency:
      group: h5-staging-account-${{ needs.account.outputs.account }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      E2E_STAGING_URL: ${{ vars.E2E_STAGING_URL }}
      TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 注入本任务独占的 CI 账号
        env:
          CLRN_CI_ACCOUNT: ${{ needs.account.outputs.account }}
          CLRN_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_CI_TEST_ACCOUNTS }}
        run: node scripts/configure-ci-account.mjs
      - name: 检查测试注册及创建场景配置
        if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'registration')
        shell: sh
        run: |
          missing=0
          names="TESTING_API_TOKEN"
          if [ "${{ inputs.scope }}" = all ]; then
            names="$names E2E_CREATION_USERNAME E2E_CREATION_PASSWORD"
          fi
          for name in $names; do
            if ! printenv "$name" | grep -q .; then
              echo "::error::缺少 $name；请检查 CI 账号池及 TESTING_API_TOKEN Secret。"
              missing=1
            fi
          done
          exit "$missing"
      - name: 安装测试依赖
        working-directory: e2e
        run: npm ci
      - name: 检查测试账号及余额接口辅助代码
        working-directory: e2e
        run: npx playwright test test-user.spec.ts test-wallet.spec.ts --workers=1
      - name: 运行线上 TypeScript 案例
        working-directory: e2e
        env:
          FUNCTIONAL_SCOPE: ${{ inputs.scope || 'existing' }}
        run: |
          if [ "$FUNCTIONAL_SCOPE" = all ]; then
            npm run test:functional
          elif [ "$FUNCTIONAL_SCOPE" = registration ]; then
            npm run test:functional:registration
          else
            npm run test:functional:existing
          fi
      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-failure-report
          path: |
            e2e/playwright-report/cases/
            e2e/test-results/cases/
