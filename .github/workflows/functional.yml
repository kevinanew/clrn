name: H5 线上功能案例

on:
  push:
    paths: ['e2e/**', '.github/workflows/functional.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: 'existing 不创建；registration 仅注册；all 包含俱乐部和牌局创建'
        type: choice
        options: [existing, registration, all]
        default: existing

permissions:
  contents: read

concurrency:
  group: h5-staging-test-account
  cancel-in-progress: false
  queue: max

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      E2E_STAGING_URL: ${{ vars.E2E_STAGING_URL }}
      E2E_CREATION_USERNAME: ${{ secrets.E2E_CREATION_USERNAME }}
      E2E_CREATION_PASSWORD: ${{ secrets.E2E_CREATION_PASSWORD }}
      TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
    steps:
      - name: 检查创建专用账号及余额接口配置
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'all'
        shell: sh
        run: |
          missing=0
          for name in E2E_CREATION_USERNAME E2E_CREATION_PASSWORD TESTING_API_TOKEN; do
            if ! printenv "$name" | grep -q .; then
              echo "::error::缺少 Actions Secret: $name；请配置独立 staging 创建账号及共用测试接口 token。"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - name: 安装测试依赖
        working-directory: e2e
        run: npm ci
      - name: 运行线上 TypeScript 案例
        working-directory: e2e
        env:
          FUNCTIONAL_SCOPE: ${{ inputs.scope || 'existing' }}
        run: |
          if [ "$FUNCTIONAL_SCOPE" = all ]; then
            npm run test:functional
          elif [ "$FUNCTIONAL_SCOPE" = registration ]; then
            npm run test:functional:registration
          else
            npm run test:functional:existing
          fi
      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-failure-report
          path: |
            e2e/playwright-report/cases/
            e2e/test-results/cases/
