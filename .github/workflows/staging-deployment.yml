name: H5 staging 部署验证

on:
  push:
    branches: [master]
    paths: ['deployments/staging.json']

permissions:
  contents: read

# 保留每次发布的测试，账号并发锁继续由各套件管理。
concurrency:
  group: h5-staging-deployment
  cancel-in-progress: false
  queue: max

jobs:
  deployment:
    runs-on: ubuntu-latest
    outputs:
      application_commit: ${{ steps.record.outputs.application_commit }}
    steps:
      - uses: actions/checkout@v4
      - id: record
        run: node scripts/staging-deployment.mjs record
  e2e:
    needs: deployment
    uses: ./.github/workflows/e2e.yml
    with:
      expected_application_commit: ${{ needs.deployment.outputs.application_commit }}
    secrets: inherit
  functional:
    needs: deployment
    uses: ./.github/workflows/functional.yml
    with:
      expected_application_commit: ${{ needs.deployment.outputs.application_commit }}
    secrets: inherit
  interactions:
    needs: deployment
    uses: ./.github/workflows/interactions.yml
    with:
      expected_application_commit: ${{ needs.deployment.outputs.application_commit }}
    secrets: inherit
  visual:
    needs: deployment
    uses: ./.github/workflows/visual.yml
    with:
      expected_application_commit: ${{ needs.deployment.outputs.application_commit }}
    secrets: inherit
