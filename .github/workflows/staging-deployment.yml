# 固定触发提交中的 Release 记录；所有套件下载同一构建，独立启动静态服务器。
name: H5 Release 构建验证

on:
  push:
    branches: [master]
    paths: ['deployments/staging.json']

permissions:
  contents: read

# 保留每次发布的测试，账号并发锁继续由各套件管理。
concurrency:
  group: h5-staging-deployment
  cancel-in-progress: false
  queue: max

jobs:
  deployment:
    name: 确认 Release 版本
    runs-on: ubuntu-latest
    outputs:
      application_commit: ${{ steps.record.outputs.application_commit }}
      release_record: ${{ steps.record.outputs.release_record }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 记录部署版本
        id: record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/staging-deployment.mjs record
  e2e:
    name: H5 端到端测试
    needs: deployment
    uses: ./.github/workflows/e2e.yml
    with:
      expected_application_commit: ${{ needs.deployment.outputs.application_commit }}
      release_record: ${{ needs.deployment.outputs.release_record }}
    secrets: inherit
  functional:
    name: H5 线上功能测试
    needs: deployment
    uses: ./.github/workflows/functional.yml
    with:
      expected_application_commit: ${{ needs.deployment.outputs.application_commit }}
      release_record: ${{ needs.deployment.outputs.release_record }}
    secrets: inherit
  interactions:
    name: H5 交互与客服回归
    needs: deployment
    uses: ./.github/workflows/interactions.yml
    with:
      expected_application_commit: ${{ needs.deployment.outputs.application_commit }}
      release_record: ${{ needs.deployment.outputs.release_record }}
    secrets: inherit
  visual:
    name: H5 画面回归
    needs: deployment
    uses: ./.github/workflows/visual.yml
    with:
      expected_application_commit: ${{ needs.deployment.outputs.application_commit }}
      release_record: ${{ needs.deployment.outputs.release_record }}
    secrets: inherit
  animations:
    name: H5 动画回归
    needs: deployment
    uses: ./.github/workflows/animations.yml
    with:
      expected_application_commit: ${{ needs.deployment.outputs.application_commit }}
      release_record: ${{ needs.deployment.outputs.release_record }}
    secrets: inherit
