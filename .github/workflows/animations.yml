# 每个浏览器任务使用固定 Release 包启动独立服务器，账号锁继续隔离共享后端。
name: H5 动画视觉回归

# 使用 100 个 Web 专用账号的新凭据，保留账号并发锁并兼容旧分支继续运行。
on:
  pull_request:
    paths:
      - 'scripts/*release*'
      - 'scripts/extract-web-package.py'
      - '.github/actions/prepare-release-web/**'
      - 'visual/**'
      - 'e2e/mitmproxy/**'
      - 'e2e/helpers/*diagnostic*'
      - 'e2e/helpers/*proxy*.ts'
      - 'scripts/connection-diagnostic-summary.mjs'
      - 'scripts/*accounts*'
      - 'scripts/*ci*'
      - 'scripts/configure-ci-account.mjs'
      - 'scripts/staging-deployment.mjs'
      - 'e2e/helpers/staging-notice.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/animations.yml'
      - '.github/workflows/ci-animations-shards.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/*release*'
      - 'scripts/extract-web-package.py'
      - '.github/actions/prepare-release-web/**'
      - 'visual/**'
      - 'e2e/mitmproxy/**'
      - 'e2e/helpers/*diagnostic*'
      - 'e2e/helpers/*proxy*.ts'
      - 'scripts/connection-diagnostic-summary.mjs'
      - 'scripts/*accounts*'
      - 'scripts/*ci*'
      - 'scripts/configure-ci-account.mjs'
      - 'scripts/staging-deployment.mjs'
      - 'e2e/helpers/staging-notice.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/animations.yml'
      - '.github/workflows/ci-animations-shards.yml'
  workflow_call:
    inputs:
      release_record:
        description: 本轮固定的 Release 发布记录
        required: false
        type: string
      expected_application_commit:
        required: true
        type: string
      card_sprite_control:
        description: 额外运行独立新页面的冻结与正常时间图集取证
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_run:
        description: 忽略失败历史并执行当前选择的完整测试计划
        type: boolean
        default: false
      suite:
        description: 需要验证的动画套件
        type: choice
        options: [all, app, texas, zhajinhua]
        default: all
      update_snapshots:
        description: 生成候选基准并连续比较三次（只上传测试产物，不自动提交）
        type: boolean
        default: false
      expected_application_commit:
        description: 本轮需要验证的 staging 应用完整提交编号
        type: string
        required: true
      release_record:
        description: 可选的固定历史 Release 发布记录 JSON（仍校验提交、大小和摘要）
        type: string
        required: false
      card_sprite_control:
        description: 额外运行独立新页面的冻结与正常时间图集取证（选择 texas 或 all）
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  accounts:
    name: 分配动画测试账号
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      priority: ${{ steps.plan.outputs.priority }}
      remaining: ${{ steps.plan.outputs.remaining }}
      priority_count: ${{ steps.plan.outputs.priority_count }}
      remaining_count: ${{ steps.plan.outputs.remaining_count }}
      release_record: ${{ steps.plan.outputs.release_record }}
      application_commit: ${{ steps.plan.outputs.application_commit }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 固定构建并规划本轮全部分片
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_SCHEDULE_OPTIONS: ${{ toJSON(inputs) }}
        run: node scripts/ci-schedule.mjs plan animations
      - name: 保存完整计划供连续修复轮次读取
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan-animations-${{ github.run_attempt }}
          path: ci-plan.json
          retention-days: 30
          if-no-files-found: error
  priority:
    name: 优先验证历史失败
    needs: accounts
    if: needs.accounts.outputs.priority_count != '0'
    uses: ./.github/workflows/ci-animations-shards.yml
    with:
      matrix: ${{ needs.accounts.outputs.priority }}
      release_record: ${{ needs.accounts.outputs.release_record }}
      expected_application_commit: ${{ needs.accounts.outputs.application_commit }}
      suite: ${{ inputs.suite || 'all' }}
      update_snapshots: ${{ inputs.update_snapshots == true }}
      card_sprite_control: ${{ inputs.card_sprite_control == true }}
    secrets: inherit
  remaining:
    name: 执行剩余完整回归
    needs: [accounts, priority]
    if: >-
      always() && !cancelled() && needs.accounts.result == 'success' &&
      needs.accounts.outputs.remaining_count != '0' &&
      (needs.priority.result == 'success' ||
       (needs.accounts.outputs.priority_count == '0' && needs.priority.result == 'skipped'))
    uses: ./.github/workflows/ci-animations-shards.yml
    with:
      matrix: ${{ needs.accounts.outputs.remaining }}
      release_record: ${{ needs.accounts.outputs.release_record }}
      expected_application_commit: ${{ needs.accounts.outputs.application_commit }}
      suite: ${{ inputs.suite || 'all' }}
      update_snapshots: ${{ inputs.update_snapshots == true }}
      card_sprite_control: ${{ inputs.card_sprite_control == true }}
    secrets: inherit
  animations:
    name: 动画关键帧 (${{ matrix.suite }}/${{ matrix.part }})
    needs: [accounts, priority, remaining]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 规划失败时仍创建失败门禁，不能让空矩阵或 skipped 放行。
      matrix: ${{ fromJSON(needs.accounts.outputs.matrix || '{"include":[{"suite":"app","locale":"zh-Hans","part":"application"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 核对当前提交全量结果并生成摘要
        env:
          CI_SCHEDULE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-schedule.mjs gate animations
