# 每个浏览器任务使用固定 Release 包启动独立服务器，账号锁继续隔离共享后端。
name: H5 动画视觉回归

# 使用 100 个 Web 专用账号的新凭据，保留账号并发锁并兼容旧分支继续运行。
on:
  pull_request:
    paths:
      - 'scripts/*release*'
      - 'scripts/extract-web-package.py'
      - '.github/actions/prepare-release-web/**'
      - 'visual/**'
      - 'e2e/mitmproxy/**'
      - 'e2e/helpers/*diagnostic*'
      - 'e2e/helpers/*proxy*.ts'
      - 'scripts/connection-diagnostic-summary.mjs'
      - 'scripts/*accounts*'
      - 'scripts/configure-ci-account.mjs'
      - 'scripts/staging-deployment.mjs'
      - 'e2e/helpers/staging-notice.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/animations.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/*release*'
      - 'scripts/extract-web-package.py'
      - '.github/actions/prepare-release-web/**'
      - 'visual/**'
      - 'e2e/mitmproxy/**'
      - 'e2e/helpers/*diagnostic*'
      - 'e2e/helpers/*proxy*.ts'
      - 'scripts/connection-diagnostic-summary.mjs'
      - 'scripts/*accounts*'
      - 'scripts/configure-ci-account.mjs'
      - 'scripts/staging-deployment.mjs'
      - 'e2e/helpers/staging-notice.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/animations.yml'
  workflow_call:
    inputs:
      release_record:
        description: 本轮固定的 Release 发布记录
        required: false
        type: string
      expected_application_commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      suite:
        description: 需要验证的动画套件
        type: choice
        options: [all, app, texas, zhajinhua]
        default: all
      update_snapshots:
        description: 生成候选基准并连续比较三次（只上传测试产物，不自动提交）
        type: boolean
        default: false
      expected_application_commit:
        description: 本轮需要验证的 staging 应用完整提交编号
        type: string
        required: true

permissions:
  contents: read

jobs:
  accounts:
    name: 分配动画测试账号
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 规划动画测试账号
        id: plan
        env:
          CI_ANIMATION_SUITE: ${{ inputs.suite || 'all' }}
        run: node scripts/plan-ci-accounts.mjs animations
  animations:
    needs: accounts
    name: 动画关键帧 (${{ matrix.suite }}/${{ matrix.part }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.accounts.outputs.matrix) }}
    concurrency:
      group: h5-staging-account-${{ matrix.account }}
      cancel-in-progress: false
      queue: max
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      CI: 'true'
      VISUAL_SUITE: ${{ matrix.suite }}
      ANIMATION_PART: ${{ matrix.part }}
      CLRN_EXPECTED_APPLICATION_COMMIT: ${{ inputs.expected_application_commit || '' }}
      TESTING_API_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 注入本任务独占的测试账号
        env:
          CLRN_CI_ACCOUNT: ${{ matrix.account }}
          CLRN_CI_TEST_ACCOUNTS: ${{ secrets.CLRN_CI_TEST_ACCOUNTS_V3 }}
        run: node scripts/configure-ci-account.mjs
      - name: 安装锁定的测试依赖
        run: |
          npm ci
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          cd visual
          pnpm install --frozen-lockfile
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装网络场景代理
        run: |
          python -m venv e2e/.venv
          e2e/.venv/bin/python -m pip install -r e2e/mitmproxy/requirements.txt
      - name: 检查应用场景与消息夹具
        if: matrix.suite == 'app' && matrix.part == 'application'
        run: e2e/.venv/bin/python -m unittest discover -s e2e/mitmproxy -v
      - name: 检查 TypeScript
        run: npm run typecheck
      - name: 验证关键帧差异汇总与牌面就绪
        if: matrix.suite == 'texas' && matrix.part == 'gameplay'
        run: node --import tsx --test visual/animations/timeline.browser.ts visual/animations/cardSpriteReadiness.browser.ts visual/animations/cardSpriteDiagnostics.browser.ts
      - name: 准备本轮 Release 构建包
        uses: ./.github/actions/prepare-release-web
        with:
          release-record: ${{ inputs.release_record || '' }}
          expected-application-commit: ${{ inputs.expected_application_commit || '' }}
          github-token: ${{ github.token }}
      - name: 生成本轮候选基准
        if: inputs.update_snapshots == true
        working-directory: visual
        run: node ../scripts/with-release-web-server.mjs pnpm run test:animations:ci --update-snapshots
      - name: 打包本套件改动的候选图
        if: always() && !cancelled() && inputs.update_snapshots == true
        shell: bash
        run: |
          mkdir -p visual/test-results/animation-candidates
          git -c safe.directory="$GITHUB_WORKSPACE" ls-files -z --modified --others --exclude-standard -- visual/animations/snapshots \
            > visual/test-results/animation-candidates/files.list
          tar --null -T visual/test-results/animation-candidates/files.list \
            -czf visual/test-results/animation-candidates/${{ matrix.suite }}-${{ matrix.part }}.tar.gz
      - name: 提前保存候选图供检查
        if: always() && !cancelled() && inputs.update_snapshots == true
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ matrix.suite }}-${{ matrix.part }}-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: visual/test-results/animation-candidates/${{ matrix.suite }}-${{ matrix.part }}.tar.gz
      - name: 连续三次比较手机和桌面动画关键帧
        working-directory: visual
        run: node ../scripts/with-release-web-server.mjs pnpm run test:animations:ci --repeat-each=3
      - name: 展示连接诊断摘要
        if: always()
        run: node scripts/connection-diagnostic-summary.mjs
      - name: 准备首张失败截图供网页预览
        if: always()
        id: preview
        shell: bash
        run: |
          if [ -d visual/test-results/animations ]; then
            screenshot=$(find visual/test-results/animations -type f \( -name 'failure.png' -o -name 'test-failed-*.png' \) -print -quit)
          fi
          if [ -n "${screenshot:-}" ]; then
            cp -- "$screenshot" visual/test-results/animations/failure-preview.png
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: 保存关键帧对比和时间采样报告
        if: always()
        id: report
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ matrix.suite }}-${{ matrix.part }}-report-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            visual/playwright-report/animations/
            visual/test-results/animations/
            visual/test-results/animation-candidates/
      - name: 单独保存失败截图
        if: always()
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: animation-${{ matrix.suite }}-${{ matrix.part }}-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            visual/test-results/animations/**/failure.png
            visual/test-results/animations/**/test-failed-*.png
      - name: 上传可直接预览的失败截图
        if: always() && steps.preview.outputs.available == 'true'
        id: preview_image
        uses: actions/upload-artifact@v7
        with:
          path: visual/test-results/animations/failure-preview.png
          archive: false
          retention-days: 14
      - name: 在运行摘要中给出截图入口
        if: always()
        env:
          PREVIEW_URL: ${{ steps.preview_image.outputs.artifact-url }}
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          echo '### 动画测试产物' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PREVIEW_URL" ]; then
            echo "[直接预览首张失败截图]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$SCREENSHOTS_URL" ]; then
            echo "[下载失败截图 PNG]($SCREENSHOTS_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$REPORT_URL" ]; then
            echo "[下载完整 Playwright 报告]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
