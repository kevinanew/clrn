services:
  visual:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/repo
      - visual_node_modules:/repo/visual/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    working_dir: /repo/visual
    environment:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      VISUAL_BASE_URL: ${VISUAL_BASE_URL:-https://h5.page.shafayouxi.org/}
      VISUAL_LOCALES: ${VISUAL_LOCALES:-zh-Hans}
      VISUAL_USERNAME: ${VISUAL_USERNAME:-laiwanvisual01}
      VISUAL_PASSWORD: ${VISUAL_PASSWORD:-visual2026test}
      VISUAL_FILTER: ${VISUAL_FILTER:-}
      VISUAL_SCOPE: ${VISUAL_SCOPE:-}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    entrypoint: ["/bin/bash", "/repo/visual/docker-entrypoint.sh"]
    command: ["test"]

volumes:
  visual_node_modules:
  pnpm_store:
